<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BULL ROOM – Richiesta ricevuta</title>
<style>
  :root { --bg:#05070c; --card:#0b0f1d; --fg:#fff; --muted:#9aa3b8; --blue:#2F6BFF; --gold:#f2c230; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; background:radial-gradient(circle at 50% 0%, #10204a 0%, var(--bg) 60%); }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid #1d2647; border-radius:24px; padding:36px 26px 30px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:in .6s ease-out both; }
  @keyframes in { from { opacity:0; transform:translateY(16px) scale(.97); } to { opacity:1; transform:none; } }
  img { width:120px; height:120px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); box-shadow:0 0 30px rgba(47,107,255,.45); animation:pop .7s .2s ease-out both; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } 70% { transform:scale(1.08); } to { transform:scale(1); opacity:1; } }
  h1 { font-size:30px; margin:22px 0 10px; font-weight:900; }
  p { color:#d8deec; font-size:17px; line-height:1.5; margin:0 0 8px; }
  .tg { display:block; margin:26px 0 6px; padding:16px; border-radius:14px; background:var(--blue); color:#fff; text-decoration:none; font-weight:800; font-size:17px; }
  .tg:active { transform:scale(.98); }
  .small { color:var(--muted); font-size:14px; margin-top:18px; }
  .disc { color:#6d7690; font-size:11px; margin-top:22px; line-height:1.4; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="BULL ROOM">
    <h1>Perfetto, ci sei! 🔥</h1>
    <p>Ho ricevuto la tua richiesta.</p>
    <p>Ti scrivo io, <b>Marco</b>, su WhatsApp a breve 👊</p>
    <p class="small">Intanto entra nel mio canale Telegram gratuito:</p>
    <a class="tg" href="https://t.me/+LBnGQlyyZ4A2N2Nk">📲 Entra nel canale gratuito</a>
    <p class="disc">Contenuto educativo, non è consulenza finanziaria. Il trading comporta rischi.</p>
  </div>
</body>
</html>
